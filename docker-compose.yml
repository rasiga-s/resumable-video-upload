version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: video_upload_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: videodb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d videodb"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack-pro:latest
    container_name: video_upload_localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
      - EXTRA_CORS_ALLOWED_ORIGINS=*
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env}
      - PERSISTENCE=1
      - SNAPSHOT_SAVE_STRATEGY=ON_REQUEST
    volumes:
      - localstack_data:/var/lib/localstack

  api:
    build: .
    container_name: video_upload_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/videodb
      - AWS_ENDPOINT_URL=http://localstack:4566
      - AWS_PUBLIC_ENDPOINT_URL=http://localhost:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - S3_BUCKET_NAME=videos-bucket
    volumes:
      - ./app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_started
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
  localstack_data:
